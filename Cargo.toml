[package]
name = "eclipse"
version = "0.2.0"
edition = "2024"

[dependencies]
tao = "0.37"
wry = { version = "0.57", features = ["devtools"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
url = "2.5"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Keep debug builds responsive enough for day-to-day browser work while still
# leaving our own crate easy to debug.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
