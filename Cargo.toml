[package]
name = "eclipse"
version = "1.0.2"
edition = "2024"
rust-version = "1.88"
description = "A fast, minimal macOS web browser with a vertical tab sidebar, built on the system WebKit"
license = "MIT"
authors = ["Sathwik Elaprolu"]
repository = "https://github.com/sathwik-e/eclipse-browser"
homepage = "https://github.com/sathwik-e/eclipse-browser"
readme = "README.md"
keywords = ["browser", "macos", "webkit", "wry", "tao"]
categories = ["gui", "web-programming"]
publish = false

[dependencies]
tao = "0.37"
wry = { version = "0.57", features = ["devtools"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
url = "2.5"

# Little Eclipse windows hand WebKit a native WKWebView through wry's
# NewWindowResponse::Create. Same versions and a subset of the features wry
# already uses, so no second copy is built.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-app-kit", "WKWebView", "WKWebViewConfiguration"] }

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Keep debug builds responsive enough for day-to-day browser work while still
# leaving our own crate easy to debug.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
