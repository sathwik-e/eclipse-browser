<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Eclipse Easel</title>
<style>
:root {
  --bg: #080A10;
  --accent: #5E9EFF;
  --text: rgba(255, 255, 255, 0.94);
  --muted: rgba(255, 255, 255, 0.62);
  --border: rgba(255, 255, 255, 0.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
  background-color: var(--bg);
  background-image: radial-gradient(rgba(255, 255, 255, 0.11) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  position: relative;
}
.easel-topbar {
  position: fixed;
  top: 16px;
  left: 20px;
  right: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  pointer-events: none;
  z-index: 100;
}
.easel-pill {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(16, 20, 30, 0.9);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 8px 14px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
}
.easel-select {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--text);
  padding: 4px 8px;
  font-size: 12.5px;
  outline: none;
}
.easel-title-input {
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-size: 14px;
  font-weight: 600;
  width: 210px;
}
.easel-toolbar {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(16, 20, 30, 0.92);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 8px 12px;
  box-shadow: 0 18px 48px rgba(0, 0, 0, 0.65);
  z-index: 100;
}
.tool-btn {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid transparent;
  color: var(--muted);
  border-radius: 9px;
  padding: 7px 12px;
  font-size: 12px;
  font-weight: 550;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  transition: all 0.16s ease;
}
.tool-btn:hover { background: rgba(255, 255, 255, 0.11); color: #fff; transform: translateY(-1px); }
.tool-btn.active { background: rgba(94, 158, 255, 0.2); border-color: var(--accent); color: #fff; }
.swatch {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid rgba(255, 255, 255, 0.2);
}
.swatch.active { border-color: #fff; transform: scale(1.12); }
#draw-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
  pointer-events: none;
}
body.draw-mode #draw-canvas {
  pointer-events: auto;
  cursor: crosshair;
}
#cards-layer {
  position: absolute;
  inset: 0;
  z-index: 5;
}
.easel-card {
  position: absolute;
  min-width: 180px;
  min-height: 110px;
  border-radius: 14px;
  padding: 12px 14px;
  background: rgba(30, 41, 59, 0.92);
  border: 1.5px solid rgba(94, 158, 255, 0.45);
  box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45);
  display: flex;
  flex-direction: column;
  gap: 8px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}
.easel-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: grab;
  font-size: 10.5px;
  color: rgba(255, 255, 255, 0.55);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 600;
}
.easel-card-del {
  background: transparent;
  border: none;
  color: rgba(255, 255, 255, 0.45);
  cursor: pointer;
  font-size: 14px;
}
.easel-card-del:hover { color: #F87171; }
.easel-card-body {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  resize: both;
  color: #fff;
  font-family: inherit;
  font-size: 13.5px;
  line-height: 1.45;
  user-select: text;
  -webkit-user-select: text;
}
.easel-link-btn {
  align-self: flex-start;
  font-size: 11.5px;
  color: var(--accent);
  background: rgba(94, 158, 255, 0.14);
  border: 1px solid rgba(94, 158, 255, 0.35);
  border-radius: 7px;
  padding: 4px 9px;
  cursor: pointer;
  text-decoration: none;
}
</style>
</head>
<body>
<div class="easel-topbar">
  <div class="easel-pill">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5E9EFF" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    <select class="easel-select" id="easel-picker"></select>
    <input type="text" class="easel-title-input" id="easel-title" placeholder="Easel Title..." />
    <button class="tool-btn" id="btn-new-easel">+ Board</button>
  </div>
  <div class="easel-pill">
    <span id="easel-status" style="font-size:11.5px;color:rgba(255,255,255,0.5);">Synced</span>
  </div>
</div>

<canvas id="draw-canvas"></canvas>
<div id="cards-layer"></div>

<div class="easel-toolbar">
  <button class="tool-btn" id="btn-add-sticky">+ Sticky Card</button>
  <button class="tool-btn" id="btn-add-text">+ Text Block</button>
  <button class="tool-btn" id="btn-add-link">+ Link Card</button>
  <button class="tool-btn" id="btn-draw-toggle">✏️ Sketch</button>
  <div class="swatch active" data-accent="#5E9EFF" data-bg="#1E293B" style="background:#5E9EFF;"></div>
  <div class="swatch" data-accent="#A78BFA" data-bg="#1E1B4B" style="background:#A78BFA;"></div>
  <div class="swatch" data-accent="#34D399" data-bg="#064E3B" style="background:#34D399;"></div>
  <div class="swatch" data-accent="#F472B6" data-bg="#4C0519" style="background:#F472B6;"></div>
  <div class="swatch" data-accent="#F59E0B" data-bg="#451A03" style="background:#F59E0B;"></div>
  <button class="tool-btn" id="btn-clear-board">Clear</button>
</div>

<script>
let easels = [];
let activeEaselId = null;
let elements = [];
let strokes = [];
let drawMode = false;
let activeAccent = '#5E9EFF';
let activeBg = '#1E293B';
let saveTimer = null;

const canvas = document.getElementById('draw-canvas');
const ctx = canvas.getContext('2d');

function postIpc(cmd) {
  if (window.__eclipseIpc) {
    window.__eclipseIpc(cmd);
  } else if (window.ipc && typeof window.ipc.postMessage === 'function') {
    window.ipc.postMessage(JSON.stringify(cmd));
  }
}

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  redrawStrokes();
}
window.addEventListener('resize', resizeCanvas);

function redrawStrokes() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  strokes.forEach(s => {
    if (!s.points || s.points.length < 2) return;
    ctx.beginPath();
    ctx.strokeStyle = s.color || '#5E9EFF';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.moveTo(s.points[0][0], s.points[0][1]);
    for (let i = 1; i < s.points.length; i++) {
      ctx.lineTo(s.points[i][0], s.points[i][1]);
    }
    ctx.stroke();
  });
}

let currentStroke = null;
canvas.addEventListener('mousedown', (e) => {
  if (!drawMode) return;
  currentStroke = { color: activeAccent, points: [[e.clientX, e.clientY]] };
  strokes.push(currentStroke);
});
canvas.addEventListener('mousemove', (e) => {
  if (!drawMode || !currentStroke) return;
  currentStroke.points.push([e.clientX, e.clientY]);
  redrawStrokes();
});
window.addEventListener('mouseup', () => {
  if (currentStroke) {
    currentStroke = null;
    scheduleSave();
  }
});

function loadEaselData(easel) {
  if (!easel) return;
  activeEaselId = easel.id;
  document.getElementById('easel-title').value = easel.title || 'Untitled Easel';
  try {
    const parsed = JSON.parse(easel.elements_json || '[]');
    if (Array.isArray(parsed)) {
      elements = parsed.filter(x => x.type !== 'stroke');
      strokes = parsed.filter(x => x.type === 'stroke');
    } else {
      elements = [];
      strokes = [];
    }
  } catch (_) {
    elements = [];
    strokes = [];
  }
  renderCards();
  redrawStrokes();
}

function renderPicker() {
  const picker = document.getElementById('easel-picker');
  picker.innerHTML = '';
  easels.forEach(e => {
    const opt = document.createElement('option');
    opt.value = e.id;
    opt.textContent = e.title || 'Untitled Easel';
    if (e.id === activeEaselId) opt.selected = true;
    picker.appendChild(opt);
  });
}

function renderCards() {
  const layer = document.getElementById('cards-layer');
  layer.innerHTML = '';
  elements.forEach((el) => {
    const card = document.createElement('div');
    card.className = 'easel-card';
    card.style.left = (el.x || 80) + 'px';
    card.style.top = (el.y || 80) + 'px';
    card.style.width = (el.w || 230) + 'px';
    card.style.minHeight = (el.h || 140) + 'px';
    card.style.background = el.color || '#1E293B';
    card.style.borderColor = el.accent || '#5E9EFF';

    const label = el.type === 'link' ? '🔗 Web Link' : (el.type === 'text' ? '📝 Text Note' : '✨ Sticky Card');
    card.innerHTML = `
      <div class="easel-card-header">
        <span>${label}</span>
        <button class="easel-card-del" title="Remove">&times;</button>
      </div>
      <textarea class="easel-card-body">${escapeHtml(el.text || '')}</textarea>
      ${el.url ? `<button class="easel-link-btn">Open ${escapeHtml(el.url)} ↗</button>` : ''}
    `;

    const header = card.querySelector('.easel-card-header');
    header.addEventListener('mousedown', (e) => {
      if (e.target.closest('.easel-card-del')) return;
      const startX = e.clientX - (el.x || 0);
      const startY = e.clientY - (el.y || 0);
      function onMove(ev) {
        el.x = Math.max(12, ev.clientX - startX);
        el.y = Math.max(12, ev.clientY - startY);
        card.style.left = el.x + 'px';
        card.style.top = el.y + 'px';
      }
      function onUp() {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);
        scheduleSave();
      }
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
    });

    card.querySelector('.easel-card-del').addEventListener('click', () => {
      elements = elements.filter(item => item.id !== el.id);
      renderCards();
      scheduleSave();
    });

    const body = card.querySelector('.easel-card-body');
    body.addEventListener('input', () => {
      el.text = body.value;
      scheduleSave();
    });

    const linkBtn = card.querySelector('.easel-link-btn');
    if (linkBtn && el.url) {
      linkBtn.addEventListener('click', () => {
        postIpc({ action: 'new_tab', url: el.url });
      });
    }

    layer.appendChild(card);
  });
}

function scheduleSave() {
  const status = document.getElementById('easel-status');
  if (status) status.textContent = 'Saving…';
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const title = document.getElementById('easel-title').value.trim() || 'Untitled Easel';
    if (!activeEaselId) activeEaselId = 'easel_' + Date.now();
    const combined = [...elements, ...strokes.map(s => ({ type: 'stroke', color: s.color, points: s.points }))];
    const json = JSON.stringify(combined);
    const existing = easels.find(e => e.id === activeEaselId);
    if (existing) {
      existing.title = title;
      existing.elements_json = json;
    } else {
      easels.unshift({ id: activeEaselId, title, elements_json: json, workspace: 'Default', updated_at: Math.floor(Date.now() / 1000) });
    }
    renderPicker();
    postIpc({ action: 'save_easel', id: activeEaselId, title, elements_json: json });
    if (status) status.textContent = 'Synced';
  }, 240);
}

document.getElementById('btn-add-sticky').addEventListener('click', () => {
  elements.push({
    id: 'card_' + Date.now(),
    type: 'sticky',
    x: 80 + (elements.length * 28) % 360,
    y: 90 + (elements.length * 24) % 260,
    w: 230,
    h: 150,
    color: activeBg,
    accent: activeAccent,
    text: 'New idea...'
  });
  renderCards();
  scheduleSave();
});

document.getElementById('btn-add-text').addEventListener('click', () => {
  elements.push({
    id: 'card_' + Date.now(),
    type: 'text',
    x: 120 + (elements.length * 24) % 340,
    y: 110 + (elements.length * 24) % 240,
    w: 260,
    h: 130,
    color: 'rgba(15, 23, 42, 0.85)',
    accent: activeAccent,
    text: 'Heading or Note...'
  });
  renderCards();
  scheduleSave();
});

document.getElementById('btn-add-link').addEventListener('click', () => {
  const url = 'https://github.com';
  elements.push({
    id: 'card_' + Date.now(),
    type: 'link',
    x: 140 + (elements.length * 24) % 340,
    y: 130 + (elements.length * 24) % 240,
    w: 240,
    h: 140,
    color: activeBg,
    accent: activeAccent,
    url: url,
    text: 'Pinned Resource\n' + url
  });
  renderCards();
  scheduleSave();
});

document.getElementById('btn-draw-toggle').addEventListener('click', (e) => {
  drawMode = !drawMode;
  document.body.classList.toggle('draw-mode', drawMode);
  e.currentTarget.classList.toggle('active', drawMode);
});

document.getElementById('btn-clear-board').addEventListener('click', () => {
  elements = [];
  strokes = [];
  renderCards();
  redrawStrokes();
  scheduleSave();
});

document.getElementById('btn-new-easel').addEventListener('click', () => {
  const id = 'easel_' + Date.now();
  const next = { id, title: 'New Easel Board', elements_json: '[]', workspace: 'Default', updated_at: Math.floor(Date.now() / 1000) };
  easels.unshift(next);
  loadEaselData(next);
  renderPicker();
  scheduleSave();
});

document.getElementById('easel-picker').addEventListener('change', (e) => {
  const found = easels.find(x => x.id === e.target.value);
  if (found) loadEaselData(found);
});

document.getElementById('easel-title').addEventListener('input', scheduleSave);

document.querySelectorAll('.swatch').forEach(sw => {
  sw.addEventListener('click', () => {
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
    sw.classList.add('active');
    activeAccent = sw.dataset.accent;
    activeBg = sw.dataset.bg;
  });
});

function escapeHtml(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function loadFromConfig(cfg) {
  if (!cfg) return;
  easels = Array.isArray(cfg.easels) && cfg.easels.length > 0 ? cfg.easels : [];
  if (!activeEaselId && easels.length > 0) {
    loadEaselData(easels[0]);
  }
  renderPicker();
}

window.onEclipseConfigUpdated = function(cfg) {
  loadFromConfig(cfg);
};

window.addEventListener('DOMContentLoaded', () => {
  resizeCanvas();
  if (window.__ECLIPSE_CONFIG__) {
    loadFromConfig(window.__ECLIPSE_CONFIG__);
  }
});
</script>
</body>
</html>
