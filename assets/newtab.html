<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>New Tab</title>
<style>
:root {
  --bg-deep: #090A0F;
  --accent: #5E9EFF;
  --accent-glow: rgba(94, 158, 255, 0.38);
  --text-primary: rgba(255, 255, 255, 0.94);
  --text-secondary: rgba(255, 255, 255, 0.56);
  --text-tertiary: rgba(255, 255, 255, 0.36);
  --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", -system-ui, sans-serif;
  background: radial-gradient(circle at 50% 14%, #141929 0%, #0b0d16 48%, var(--bg-deep) 85%);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  position: relative;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Ambient Eclipse Corona Glow. A soft gradient instead of an animated
   blur filter: the page is often left open, and anything animating forever
   here keeps WebKit repainting while idle. */
.eclipse-halo {
  position: absolute;
  top: -230px;
  width: 640px;
  height: 640px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(94, 158, 255, 0.17) 0%, rgba(139, 92, 246, 0.1) 32%, rgba(139, 92, 246, 0.04) 50%, transparent 68%);
  pointer-events: none;
  animation: haloFadeIn 1.2s ease-out both;
}

@keyframes haloFadeIn {
  from { transform: scale(0.95); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

/* Hero Celestial Eclipse Emblem */
.eclipse-hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 22px;
  z-index: 10;
}

.eclipse-emblem {
  width: 54px;
  height: 54px;
  border-radius: 50%;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 8px;
}

.eclipse-emblem .eclipse-corona {
  width: 44px;
  height: 44px;
}

.eclipse-emblem .eclipse-star {
  width: 30px;
  height: 30px;
}

.eclipse-emblem .eclipse-moon {
  width: 31px;
  height: 31px;
}

.eclipse-emblem .eclipse-diamond {
  width: 7px;
  height: 7px;
}

/* The hero emblem plays its transit once and then rests at totality. */
.eclipse-emblem .eclipse-star {
  animation: none;
  transform: scale(1.06);
}

.eclipse-emblem .eclipse-corona {
  animation: coronaReveal 1.4s var(--ease-spring) both;
}

.eclipse-emblem .eclipse-moon {
  animation: moonArrive 1.4s cubic-bezier(0.42, 0, 0.58, 1) both;
}

.eclipse-emblem .eclipse-diamond {
  animation: diamondFlash 1.4s ease-in-out both;
}

@keyframes moonArrive {
  from { transform: translateX(-16px) scale(0.9); opacity: 0; }
  to { transform: none; opacity: 1; }
}

@keyframes coronaReveal {
  from { transform: scale(0.85); opacity: 0.3; }
  to { transform: scale(1.12); opacity: 0.9; }
}

body.is-navigating .eclipse-emblem {
  transform: scale(1.18);
  transition: transform 0.35s var(--ease-spring);
}

/* Cosmic Centered Search Bar */
.command-bar-card {
  width: 100%;
  max-width: 620px;
  background: rgba(16, 20, 30, 0.88);
  backdrop-filter: blur(44px) saturate(200%);
  -webkit-backdrop-filter: blur(44px) saturate(200%);
  border: 1px solid rgba(255, 255, 255, 0.13);
  border-radius: 18px;
  box-shadow: 0 24px 64px rgba(0, 0, 0, 0.72), 0 0 24px rgba(94, 158, 255, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.1);
  overflow: hidden;
  z-index: 10;
  animation: cardFadeIn 0.32s var(--ease-spring);
  transition: border-color 0.25s var(--ease-spring), box-shadow 0.25s var(--ease-spring), transform 0.25s var(--ease-spring);
}

@keyframes cardFadeIn {
  from { opacity: 0; transform: scale(0.97) translateY(8px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.command-bar-card:focus-within {
  border-color: rgba(94, 158, 255, 0.6);
  box-shadow: 0 32px 80px rgba(0, 0, 0, 0.8), 0 0 36px rgba(94, 158, 255, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.2);
}

.command-bar-card.is-loading {
  border-color: rgba(94, 158, 255, 0.75);
  box-shadow: 0 32px 84px rgba(0, 0, 0, 0.85), 0 0 42px rgba(94, 158, 255, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.25);
}

.command-bar-header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 15px 20px;
  position: relative;
}

.command-bar-card.has-results .command-bar-header {
  border-bottom: 0.5px solid rgba(255, 255, 255, 0.08);
}

.command-bar-icon {
  width: 20px;
  height: 20px;
  color: var(--accent);
  filter: drop-shadow(0 0 8px rgba(94, 158, 255, 0.6));
  flex-shrink: 0;
  transition: transform 0.2s var(--ease-spring);
}

.command-bar-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: #FFFFFF;
  font-size: 16px;
  font-family: inherit;
  font-weight: 450;
  letter-spacing: -0.2px;
  user-select: text;
  -webkit-user-select: text;
}

.command-bar-input::placeholder {
  color: rgba(255, 255, 255, 0.42);
}

.command-bar-badge {
  font-size: 11.5px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.5);
  background: rgba(255, 255, 255, 0.08);
  border: 0.5px solid rgba(255, 255, 255, 0.12);
  padding: 4px 9px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  gap: 4px;
  pointer-events: none;
  user-select: none;
  transition: opacity 0.15s ease;
}

/* Celestial Eclipse Loader in Search Bar */
.search-loader-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  flex-shrink: 0;
  animation: loaderFadeIn 0.2s ease-out;
}

@keyframes loaderFadeIn {
  from { opacity: 0; transform: scale(0.85); }
  to { opacity: 1; transform: scale(1); }
}

/* The eclipse only plays while the user types: its glow animates box-shadow,
   which repaints every frame, so an always-on loop costs CPU on an idle page. */
.eclipse-emblem > *,
.eclipse-loader > * {
  animation-play-state: paused;
}

body.eclipse-active .eclipse-emblem > *,
body.eclipse-active .eclipse-loader > * {
  animation-play-state: running;
}

@media (prefers-reduced-motion: reduce) {
  body.eclipse-active .eclipse-emblem > *,
  body.eclipse-active .eclipse-loader > * {
    animation-play-state: paused;
  }
}

.eclipse-loader {
  width: 22px;
  height: 22px;
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  overflow: visible;
}

.eclipse-star {
  position: absolute;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: radial-gradient(circle at 38% 38%, #ffffff 0%, #93c5fd 25%, #38bdf8 55%, #1d4ed8 100%);
  box-shadow: 0 0 6px #38bdf8, 0 0 12px rgba(56, 189, 248, 0.75);
  animation: starLuminescence 2.2s ease-in-out infinite;
  z-index: 1;
}

.eclipse-corona {
  position: absolute;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  pointer-events: none;
  border: 1px solid rgba(147, 197, 253, 0.9);
  box-shadow: 0 0 10px rgba(56, 189, 253, 0.8), inset 0 0 6px rgba(37, 99, 235, 0.6);
  animation: coronaFlare 2.2s ease-in-out infinite;
  z-index: 0;
}

.eclipse-moon {
  position: absolute;
  width: 11.5px;
  height: 11.5px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #0f172a 0%, #030712 100%);
  box-shadow: inset -1px -1px 2px rgba(147, 197, 253, 0.5);
  animation: moonTransit 2.2s cubic-bezier(0.42, 0, 0.58, 1) infinite;
  z-index: 2;
}

.eclipse-diamond {
  position: absolute;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: #ffffff;
  box-shadow: 0 0 5px #ffffff, 0 0 9px #93c5fd;
  pointer-events: none;
  animation: diamondFlash 2.2s ease-in-out infinite;
  z-index: 3;
}

@keyframes moonTransit {
  0% {
    transform: translateX(-16px) scale(0.9);
    opacity: 0;
  }
  15% {
    opacity: 1;
  }
  50% {
    transform: translateX(0px) scale(1.02);
    opacity: 1;
  }
  85% {
    opacity: 1;
  }
  100% {
    transform: translateX(16px) scale(0.9);
    opacity: 0;
  }
}

/* The loader only runs while a navigation is in flight, and its keyframes
   animate transform and opacity alone so they stay on the compositor. */
@keyframes starLuminescence {
  0%, 100% {
    transform: scale(0.95);
    opacity: 0.85;
  }
  50% {
    transform: scale(1.08);
    opacity: 1;
  }
}

@keyframes coronaFlare {
  0%, 100% {
    transform: scale(0.85);
    opacity: 0.3;
  }
  46%, 54% {
    transform: scale(1.38);
    opacity: 1;
  }
}

@keyframes diamondFlash {
  0%, 43% {
    opacity: 0;
    transform: translate(4px, -4px) scale(0);
  }
  50% {
    opacity: 1;
    transform: translate(4.5px, -4.5px) scale(1.6);
  }
  57%, 100% {
    opacity: 0;
    transform: translate(5px, -5px) scale(0);
  }
}

/* Command Bar Results Dropdown */
.command-bar-results {
  padding: 6px;
  display: none;
  flex-direction: column;
  gap: 2px;
  max-height: 340px;
  overflow-y: auto;
}

.command-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 12px;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.15s var(--ease-spring);
  color: var(--text-secondary);
}

.command-item:hover,
.command-item.selected {
  background: rgba(255, 255, 255, 0.09);
  color: var(--text-primary);
}

.command-item-icon {
  width: 18px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.command-item-icon svg {
  width: 16px;
  height: 16px;
}

.command-item-icon img {
  width: 16px;
  height: 16px;
  border-radius: 3px;
  object-fit: contain;
}

.command-item-title {
  flex: 1;
  font-size: 13.5px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.command-item-action {
  font-size: 11.5px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 12px;
  color: var(--text-secondary);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: all 0.18s ease;
}

.command-item:hover .command-item-action,
.command-item.selected .command-item-action {
  background: #FFFFFF;
  color: #0A0D14;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
}

/* Quick Arc Feature Pills below search bar */
.arc-quick-deck {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 18px;
  z-index: 10;
  flex-wrap: wrap;
  justify-content: center;
}

.quick-pill {
  background: rgba(255, 255, 255, 0.045);
  border: 1px solid rgba(255, 255, 255, 0.09);
  border-radius: 999px;
  padding: 7px 14px;
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s var(--ease-spring);
}

.quick-pill:hover {
  background: rgba(94, 158, 255, 0.14);
  border-color: rgba(94, 158, 255, 0.45);
  color: #FFFFFF;
  transform: translateY(-1.5px);
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    transition-duration: 0.001ms !important;
  }
}
</style>
</head>
<body>

<div class="eclipse-halo"></div>

<div class="eclipse-hero" id="eclipse-hero">
  <div class="eclipse-emblem" title="Celestial Eclipse">
    <div class="eclipse-corona"></div>
    <div class="eclipse-star"></div>
    <div class="eclipse-moon"></div>
    <div class="eclipse-diamond"></div>
  </div>
</div>

<div class="command-bar-card" id="command-card">
  <div class="command-bar-header">
    <svg class="command-bar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
      <circle cx="11" cy="11" r="7"/>
      <path d="m20 20-3.5-3.5"/>
    </svg>
    <input type="text" class="command-bar-input" id="search-box" placeholder="Search the cosmos or enter URL..." autofocus spellcheck="false" autocomplete="off" />
    <div class="command-bar-badge" id="command-badge" title="Press Enter to search or open">
      <span>↵ Return</span>
    </div>
    <div class="search-loader-wrap" id="search-loader" style="display: none;" title="Loading...">
      <div class="eclipse-loader">
        <div class="eclipse-corona"></div>
        <div class="eclipse-star"></div>
        <div class="eclipse-moon"></div>
        <div class="eclipse-diamond"></div>
      </div>
    </div>
  </div>
  <div class="command-bar-results" id="command-bar-results" style="display: none;"></div>
</div>

<div class="arc-quick-deck">
  <button class="quick-pill" data-action="open_notes_tab">📝 Notes</button>
  <button class="quick-pill" data-action="open_easel_tab">🎨 Easel</button>
  <button class="quick-pill" data-action="tidy_tabs">✨ Tidy Tabs</button>
  <button class="quick-pill" data-action="command_bar_open_url" data-command="open_downloads">⬇️ Downloads</button>
</div>

<script>
let openTabs = [];
let selectedIndex = 0;

function postIpc(cmd) {
  if (window.__eclipseIpc) {
    window.__eclipseIpc(cmd);
    return;
  }
  if (window.ipc && typeof window.ipc.postMessage === 'function') {
    window.ipc.postMessage(JSON.stringify(cmd));
  }
}

function setLoading(isLoading) {
  const card = document.getElementById('command-card');
  const badge = document.getElementById('command-badge');
  const loader = document.getElementById('search-loader');
  if (!card) return;
  document.body.classList.toggle('is-navigating', !!isLoading);
  if (isLoading) {
    card.classList.add('is-loading');
    if (badge) badge.style.display = 'none';
    if (loader) loader.style.display = 'flex';
  } else {
    card.classList.remove('is-loading');
    if (loader) loader.style.display = 'none';
    if (badge) badge.style.display = 'flex';
  }
}

function getCommandItems() {
  const query = (document.getElementById('search-box').value || '').trim();
  if (!query) return [];

  const qLower = query.toLowerCase();
  let items = [];

  items.push({
    id: null,
    title: `Search for "${query}"`,
    url: query,
    icon: 'search',
    is_open: false,
    is_search: true
  });

  const looksLikeUrl = /^https?:\/\//i.test(query) ||
    (!/\s/.test(query) && (query.includes('.') || /^localhost(:\d+)?(\/|$)/i.test(query)));
  if (looksLikeUrl) {
    let directUrl = query;
    if (!/^https?:\/\//i.test(directUrl)) {
      // Local dev servers rarely speak TLS.
      directUrl = (/^(localhost|127\.0\.0\.1)(:\d+)?(\/|$)/i.test(directUrl) ? 'http://' : 'https://') + directUrl;
    }
    items.push({
      id: null,
      title: `Open ${query}`,
      url: directUrl,
      icon: 'globe',
      is_open: false
    });
  }

  if (openTabs && openTabs.length > 0) {
    openTabs
      .filter(t => t.url !== 'eclipse://newtab' && (
        (t.title && t.title.toLowerCase().includes(qLower)) ||
        (t.url && t.url.toLowerCase().includes(qLower))
      ))
      .forEach(t => {
        items.push({
          id: t.id,
          title: t.title || cleanUrl(t.url),
          url: t.url,
          icon: t.favicon_url || '',
          is_open: true
        });
      });
  }

  return items;
}

function cleanUrl(url) {
  if (!url || url.startsWith('eclipse://newtab')) return 'New Tab';
  if (url.startsWith('eclipse://settings')) return 'Preferences';
  if (url.startsWith('eclipse://notes')) return 'Eclipse Notes';
  if (url.startsWith('eclipse://easel')) return 'Eclipse Easel';
  try {
    const u = new URL(url);
    return u.hostname.replace(/^www\./, '');
  } catch (e) {
    return url;
  }
}

function renderCommandResults() {
  const container = document.getElementById('command-bar-results');
  const card = document.getElementById('command-card');
  if (!container || !card) return;
  const items = getCommandItems();

  if (items.length === 0) {
    container.style.display = 'none';
    container.replaceChildren();
    card.classList.remove('has-results');
    return;
  }

  card.classList.add('has-results');
  container.style.display = 'flex';
  if (selectedIndex >= items.length) {
    selectedIndex = Math.max(0, items.length - 1);
  }

  container.replaceChildren();
  items.forEach((item, idx) => {
    const row = document.createElement('div');
    row.className = 'command-item' + (idx === selectedIndex ? ' selected' : '');
    const icon = document.createElement('div');
    icon.className = 'command-item-icon';
    icon.appendChild(buildIcon(item));
    const title = document.createElement('div');
    title.className = 'command-item-title';
    title.textContent = item.title;
    const action = document.createElement('div');
    action.className = 'command-item-action';
    action.textContent = item.is_search ? 'Search ↗' : (item.is_open ? 'Switch to Tab →' : 'Open ↗');
    row.append(icon, title, action);
    row.addEventListener('click', () => {
      executeCommandItem(item);
    });
    row.addEventListener('mouseenter', () => {
      selectedIndex = idx;
      updateSelection();
    });
    container.appendChild(row);
  });
}

function updateSelection() {
  const container = document.getElementById('command-bar-results');
  if (!container) return;
  Array.from(container.children).forEach((child, idx) => {
    child.classList.toggle('selected', idx === selectedIndex);
  });
}

function executeCommandItem(item) {
  if (item.id !== null && item.id !== undefined) {
    postIpc({ action: 'select_tab', id: item.id });
  } else {
    routeQuery(item.url);
  }
}

function routeQuery(input) {
  const q = (input || '').trim();
  if (!q) return;
  setLoading(true);
  if (window.__eclipseIpc || (window.ipc && typeof window.ipc.postMessage === 'function')) {
    postIpc({ action: 'navigate', url: q });
  } else {
    location.href = q.includes('.') && !q.includes(' ')
      ? (q.startsWith('http') ? q : 'https://' + q)
      : 'https://duckduckgo.com/?q=' + encodeURIComponent(q);
  }
}

const searchBox = document.getElementById('search-box');
searchBox.addEventListener('keydown', (e) => {
  const items = getCommandItems();
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (items.length > 0) {
      selectedIndex = (selectedIndex + 1) % items.length;
      updateSelection();
    }
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (items.length > 0) {
      selectedIndex = (selectedIndex - 1 + items.length) % items.length;
      updateSelection();
    }
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (items[selectedIndex]) {
      executeCommandItem(items[selectedIndex]);
    } else {
      routeQuery(searchBox.value);
    }
  } else if (e.key === 'Escape') {
    searchBox.value = '';
    renderCommandResults();
    setLoading(false);
  }
});

let eclipseIdleTimer = null;

searchBox.addEventListener('input', () => {
  // A new query starts from the top result (search), not the old slot.
  selectedIndex = 0;
  renderCommandResults();
  document.body.classList.add('eclipse-active');
  clearTimeout(eclipseIdleTimer);
  eclipseIdleTimer = setTimeout(() => document.body.classList.remove('eclipse-active'), 1600);
});

const SVG_NS = 'http://www.w3.org/2000/svg';

function svgIcon(stroke, width, shapes) {
  const svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', stroke);
  svg.setAttribute('stroke-width', width);
  shapes.forEach(([tag, attrs]) => {
    const node = document.createElementNS(SVG_NS, tag);
    Object.keys(attrs).forEach(k => node.setAttribute(k, attrs[k]));
    svg.appendChild(node);
  });
  return svg;
}

function globeIcon() {
  return svgIcon('currentColor', '1.8', [
    ['circle', { cx: '12', cy: '12', r: '9' }],
    ['path', { d: 'M3 12h18M12 3a14.5 14.5 0 0 1 0 18M12 3a14.5 14.5 0 0 0 0 18' }]
  ]);
}

// Favicons come from pages, so only image URLs are accepted, set as a property.
function buildIcon(item) {
  if (item.is_search) {
    return svgIcon('#5E9EFF', '2.2', [
      ['circle', { cx: '11', cy: '11', r: '7' }],
      ['path', { d: 'm20 20-3.5-3.5' }]
    ]);
  }
  const src = typeof item.icon === 'string' ? item.icon : '';
  if (/^(https?:|data:image\/)/i.test(src)) {
    const img = document.createElement('img');
    img.alt = '';
    img.referrerPolicy = 'no-referrer';
    img.addEventListener('error', () => img.replaceWith(globeIcon()), { once: true });
    img.src = src;
    return img;
  }
  return globeIcon();
}

document.querySelectorAll('.quick-pill').forEach(pill => {
  pill.addEventListener('click', () => {
    const cmd = { action: pill.dataset.action };
    if (pill.dataset.command) cmd.command = pill.dataset.command;
    postIpc(cmd);
  });
});

window.onEclipseStateUpdated = function(state) {
  if (!state) return;
  if (typeof state.is_loading === 'boolean') {
    setLoading(state.is_loading);
  }
  if (Array.isArray(state.tabs)) {
    openTabs = state.tabs;
    if (searchBox.value.trim()) {
      renderCommandResults();
    }
  }
};

window.onEclipseConfigUpdated = function(cfg) {
  if (cfg && cfg.accent_color) {
    document.documentElement.style.setProperty('--accent', cfg.accent_color);
  }
};
window.onEclipseConfigUpdated(window.__ECLIPSE_CONFIG__);

window.addEventListener('DOMContentLoaded', () => {
  if (searchBox) {
    searchBox.focus();
  }
});
</script>
</body>
</html>
