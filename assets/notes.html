<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Eclipse Notes</title>
<style>
:root {
  --bg: #090A0F;
  --panel: rgba(18, 22, 33, 0.88);
  --card: rgba(255, 255, 255, 0.045);
  --card-hover: rgba(255, 255, 255, 0.08);
  --accent: #5E9EFF;
  --text: rgba(255, 255, 255, 0.94);
  --muted: rgba(255, 255, 255, 0.6);
  --dim: rgba(255, 255, 255, 0.38);
  --border: rgba(255, 255, 255, 0.1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
  background: radial-gradient(circle at 20% 0%, rgba(94, 158, 255, 0.12), transparent 50%), var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
.sidebar-pane {
  width: 280px;
  border-right: 1px solid var(--border);
  background: var(--panel);
  display: flex;
  flex-direction: column;
  padding: 20px 14px;
  gap: 12px;
}
.pane-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.pane-title {
  font-size: 16px;
  font-weight: 650;
  display: flex;
  align-items: center;
  gap: 8px;
}
.btn-new {
  background: var(--accent);
  color: #090A0F;
  border: none;
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.15s ease, filter 0.15s ease;
}
.btn-new:hover { filter: brightness(1.1); transform: translateY(-1px); }
.search-input {
  width: 100%;
  height: 34px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0 11px;
  color: var(--text);
  font-size: 12.5px;
  outline: none;
}
.search-input:focus { border-color: var(--accent); }
.notes-list {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.note-card {
  padding: 10px 12px;
  border-radius: 10px;
  background: var(--card);
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.16s ease;
}
.note-card:hover { background: var(--card-hover); }
.note-card.active {
  background: rgba(94, 158, 255, 0.14);
  border-color: var(--accent);
}
.note-card-title {
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 3px;
}
.note-card-preview {
  font-size: 11.5px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.note-card-meta {
  font-size: 10px;
  color: var(--dim);
  margin-top: 5px;
  display: flex;
  justify-content: space-between;
}
.editor-pane {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 28px 40px;
  gap: 14px;
  max-width: 920px;
  margin: 0 auto;
  width: 100%;
}
.editor-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.title-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.4px;
}
.editor-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.status-pill {
  font-size: 11px;
  color: var(--dim);
  padding: 4px 9px;
  border-radius: 6px;
  background: var(--card);
}
.btn-action {
  background: var(--card);
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 6px 11px;
  font-size: 12px;
  cursor: pointer;
}
.btn-action:hover { color: var(--text); background: var(--card-hover); }
.btn-action.danger:hover { color: #F87171; border-color: #F87171; }
.content-textarea {
  flex: 1;
  width: 100%;
  background: transparent;
  border: none;
  outline: none;
  resize: none;
  color: var(--text);
  font-family: inherit;
  font-size: 15px;
  line-height: 1.65;
}
</style>
</head>
<body>
<div class="sidebar-pane">
  <div class="pane-header">
    <div class="pane-title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E9EFF" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      <span>Eclipse Notes</span>
    </div>
    <button class="btn-new" id="btn-create-note">+ New</button>
  </div>
  <input type="text" class="search-input" id="note-search" placeholder="Search notes..." />
  <div class="notes-list" id="notes-list"></div>
</div>
<div class="editor-pane">
  <div class="editor-top">
    <input type="text" class="title-input" id="note-title" placeholder="Untitled Note..." />
    <div class="editor-actions">
      <span class="status-pill" id="save-status">Saved</span>
      <button class="btn-action danger" id="btn-delete-note">Delete</button>
    </div>
  </div>
  <textarea class="content-textarea" id="note-content" placeholder="Write markdown, paste snippets, or jot down research thoughts..."></textarea>
</div>
<script>
let notes = [];
let activeNoteId = null;
let currentWorkspace = 'Default';
let saveTimer = null;

function postIpc(cmd) {
  if (window.__eclipseIpc) {
    window.__eclipseIpc(cmd);
  } else if (window.ipc && typeof window.ipc.postMessage === 'function') {
    window.ipc.postMessage(JSON.stringify(cmd));
  }
}

function loadFromConfig(cfg) {
  if (!cfg) return;
  if (cfg.accent_color) {
    document.documentElement.style.setProperty('--accent', cfg.accent_color);
  }
  notes = Array.isArray(cfg.notes) ? cfg.notes : [];
  if (!activeNoteId && notes.length > 0) {
    activeNoteId = notes[0].id;
    populateEditor(notes[0]);
  }
  renderNotesList();
}

function populateEditor(note) {
  const titleEl = document.getElementById('note-title');
  const contentEl = document.getElementById('note-content');
  if (!note) {
    titleEl.value = '';
    contentEl.value = '';
    return;
  }
  if (document.activeElement !== titleEl) titleEl.value = note.title || '';
  if (document.activeElement !== contentEl) contentEl.value = note.content || '';
}

function renderNotesList() {
  const list = document.getElementById('notes-list');
  const q = (document.getElementById('note-search').value || '').toLowerCase();
  list.innerHTML = '';
  const filtered = notes.filter(n => !q || (n.title || '').toLowerCase().includes(q) || (n.content || '').toLowerCase().includes(q));
  filtered.forEach(n => {
    const el = document.createElement('div');
    el.className = 'note-card' + (n.id === activeNoteId ? ' active' : '');
    const preview = (n.content || '').replace(/\n+/g, ' ').slice(0, 80) || 'Empty note';
    el.innerHTML = `
      <div class="note-card-title">${escapeHtml(n.title || 'Untitled Note')}</div>
      <div class="note-card-preview">${escapeHtml(preview)}</div>
      <div class="note-card-meta">
        <span>${escapeHtml(n.workspace || 'Work')}</span>
      </div>
    `;
    el.addEventListener('click', () => {
      activeNoteId = n.id;
      populateEditor(n);
      renderNotesList();
    });
    list.appendChild(el);
  });
}

function scheduleSave() {
  const status = document.getElementById('save-status');
  if (status) status.textContent = 'Saving…';
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const title = document.getElementById('note-title').value.trim() || 'Untitled Note';
    const content = document.getElementById('note-content').value;
    if (!activeNoteId) {
      activeNoteId = 'note_' + Date.now();
    }
    const existing = notes.find(n => n.id === activeNoteId);
    if (existing) {
      existing.title = title;
      existing.content = content;
    } else {
      notes.unshift({ id: activeNoteId, title, content, workspace: currentWorkspace, updated_at: Math.floor(Date.now() / 1000) });
    }
    postIpc({ action: 'save_note', id: activeNoteId, title, content, workspace: currentWorkspace });
    renderNotesList();
    if (status) status.textContent = 'Saved';
  }, 220);
}

document.getElementById('btn-create-note').addEventListener('click', () => {
  const newId = 'note_' + Date.now();
  const newNote = { id: newId, title: 'Untitled Note', content: '', workspace: currentWorkspace, updated_at: Math.floor(Date.now() / 1000) };
  notes.unshift(newNote);
  activeNoteId = newId;
  populateEditor(newNote);
  renderNotesList();
  postIpc({ action: 'save_note', id: newId, title: newNote.title, content: '', workspace: currentWorkspace });
  document.getElementById('note-title').focus();
  document.getElementById('note-title').select();
});

document.getElementById('btn-delete-note').addEventListener('click', () => {
  if (!activeNoteId) return;
  const delId = activeNoteId;
  notes = notes.filter(n => n.id !== delId);
  postIpc({ action: 'delete_note', id: delId });
  activeNoteId = notes[0] ? notes[0].id : null;
  populateEditor(notes[0] || null);
  renderNotesList();
});

document.getElementById('note-title').addEventListener('input', scheduleSave);
document.getElementById('note-content').addEventListener('input', scheduleSave);
document.getElementById('note-search').addEventListener('input', renderNotesList);

function escapeHtml(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

window.onEclipseConfigUpdated = function(cfg) {
  loadFromConfig(cfg);
};

window.addEventListener('DOMContentLoaded', () => {
  if (window.__ECLIPSE_CONFIG__) {
    loadFromConfig(window.__ECLIPSE_CONFIG__);
  }
});
</script>
</body>
</html>
