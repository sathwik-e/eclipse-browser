<!doctype html><html><head><title>Opener</title>
<style>html,body{margin:0;height:100%}button{width:100%;height:100%;font-size:30px}</style></head>
<body><button id=b>go</button><script>
// The "other site": the same server on the next port, under another host name.
var V = 'http://localhost:' + (Number(location.port) + 1);
var s = new URLSearchParams(location.search).get('s');
function report(m) { window.webkit.messageHandlers.ipc.postMessage('opener:' + m); }
function fake(w) {
  try { w.stop(); w.document.open(); w.document.write('<title>Sign in</title><h1>FAKE LOGIN</h1>'); w.document.close(); report('wrote:' + w.document.title); }
  catch (e) { report('err:' + e); }
}
var S = {
  stopwrite: function () { var w = window.open(V + '/slow', 'x', 'width=480,height=600'); setTimeout(function () { fake(w); }, 800); },
  nocontent: function () { var w = window.open(V + '/generate_204', 'x', 'width=480,height=600'); setTimeout(function () { fake(w); }, 800); },
  blankthen: function () { var w = window.open('', 'x', 'width=480,height=600'); w.location = V + '/slow'; setTimeout(function () { fake(w); }, 800); },
  legit: function () { window.open(V + '/pop.html', 'x', 'width=480,height=600'); },
  // Popup windows that give no (or only part of a) size, and a plain
  // window.open, which is a tab.
  popupkw: function () { window.open(V + '/pop.html', 'x', 'popup'); },
  widthonly: function () { window.open(V + '/pop.html', 'x', 'width=520'); },
  notoolbar: function () { window.open(V + '/pop.html', 'x', 'toolbar=no,location=no,menubar=no'); },
  plainopen: function () { window.open(V + '/pop.html', 'x'); },
  eclipse: function () { window.open('/eimg.html', 'x', 'width=480,height=600'); },
  sameorigin: function () { window.open('/same.html', 'x', 'width=480,height=600'); },
  five: function () { for (var i = 0; i < 5; i++) window.open('/pop.html?n=' + i, 'w' + i, 'width=400,height=300'); },
  nested: function () { window.open('/nest.html', 'x', 'width=480,height=600'); },
  openernav: function () { window.open(V + '/onav.html', 'x', 'width=480,height=600'); },
  sheet: function () { window.open('/dlg.html', 'x', 'width=480,height=600'); },
  print2: function () { window.open('/prt.html', 'x', 'width=480,height=600'); },
  printclose: function () { window.open('/prc.html', 'x', 'width=480,height=600'); },
  resize: function () { var w = window.open('/rsz.html', 'x', 'width=480,height=600'); report('outer=' + w.outerWidth + 'x' + w.outerHeight); },
  menu: function () { window.open('/pop.html', 'x', 'width=480,height=600'); },
  linktab: function () { window.open('/lnk.html', 'x', 'width=480,height=600'); },
  // Open in Eclipse from the bar's button / ⌘O.
  openin: function () { window.open(V + '/pop.html', 'x', 'width=480,height=600'); },
  openkey: function () { window.open(V + '/pop.html', 'x', 'width=480,height=600'); },
  // Standalone windows are opened by the harness itself (no opener).
  standalone: function () {}, address: function () {}, addreclipse: function () {}, longhost: function () {},
  dlstandalone: function () {}, dlnotab: function () {}, dllink: function () {}, dlattr: function () {},
  // A popup whose page turns out to be a file.
  dlpopup: function () { window.open('/dl/slow-popup.zip', 'x', 'popup'); },
  // The second click reopens the popup by name / focuses it.
  refocus: function () { clicks++; window.open(V + '/pop.html?n=' + clicks, 'x', 'width=480,height=600'); },
  focus: function () { clicks++; if (clicks === 1) popup = window.open(V + '/pop.html', 'x', 'width=480,height=600'); else { popup.focus(); report('focused'); } },
};
var clicks = 0, popup = null;
if (s === 'nogesture') { window.open('/pop.html', 'x', 'width=480,height=600'); }
document.getElementById('b').onclick = function () { S[s](); };
</script></body></html>
